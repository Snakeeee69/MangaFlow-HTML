<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MangaFlow - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">

  <div class="text-center mb-4">
    <a href="index.html" class="text-decoration-none d-inline-flex flex-column align-items-center gap-2 mb-2">
      <div class="logo-box rounded-circle p-2 d-inline-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #a100ff, #e100ff); width: 64px; height: 64px;">
        <img src="images/logo/logoMangaFlow.png" alt="MangaFlow Logo" class="rounded-circle" style="width: 48px; height: 48px; object-fit: cover;" onerror="this.outerHTML='<i class=\'fa-solid fa-book-open text-white fs-4\'></i>';" />
      </div>
      <span class="fs-2 fw-bold text-white">Manga<span style="color: #d178ff;">Flow</span></span>
    </a>
    <p class="text-secondary small m-0">Inicia sesión para continuar</p>
  </div>

  <div class="login-card">
    <div id="error-box" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert"></div>

    <form id="form-login" novalidate>
      <div class="mb-3">
        <label for="correo" class="form-label text-white fw-semibold small mb-2">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text input-group-text-mf border-end-0">
            <i class="fa-regular fa-envelope"></i>
          </span>
          <input type="email" id="correo" class="form-control form-input-mf border-start-0 ps-0" placeholder="tu@correo.cl" required />
        </div>
      </div>

      <div class="mb-4">
        <label for="contrasena" class="form-label text-white fw-semibold small mb-2">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text input-group-text-mf border-end-0">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="contrasena" class="form-control form-input-mf border-start-0 border-end-0 ps-0" placeholder="••••••••" required />
          <button class="input-group-text input-group-text-mf border-start-0" type="button" id="btn-toggle-pass">
            <i id="eye-icon" class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-mf-primary">
        Iniciar sesión
      </button>
    </form>

    <div class="divider-o">o</div>

    <button type="button" id="btn-invitado" class="btn-mf-guest">
      Entrar como invitado
    </button>
    
    <p class="text-center text-secondary text-xs mt-2 mb-0" style="font-size: 0.75rem;">
      Sin puntos ni compras — solo para explorar
    </p>

    <div class="text-center mt-4 pt-2">
      <span class="text-secondary text-xs" style="font-size: 0.75rem;">
        Admin: alejandro@mangaflow.cl / 123456
      </span>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="login.js"></script>
</body>
</html>
